name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release_notes:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.compose.outputs.body }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compose release notes
        id: compose
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          current_tag="v${VERSION}"
          previous_tag="$(git tag --sort=-version:refname | grep -vx "$current_tag" | head -n 1 || true)"

          if [[ -n "$previous_tag" ]]; then
            commit_range="${previous_tag}..HEAD"
            compare_text="Changes since ${previous_tag}"
          else
            commit_range="HEAD"
            compare_text="Initial release"
          fi

          commit_log="$(git log --no-merges --pretty=format:'- %s (%h)' ${commit_range} | head -n 40 || true)"
          if [[ -z "$commit_log" ]]; then
            commit_log='- No commit summaries were available for this build.'
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            echo "## SimpleSpread ${current_tag}"
            echo
            echo "${compare_text}"
            echo
            echo "A native macOS spreadsheet: XLSX native format, CSV import/export,"
            echo "and a Google-Sheets-level formula engine."
            echo
            echo "> **Note:** This build is arm64 (Apple Silicon) only."
            echo "> If Gatekeeper blocks the app, right-click → Open on first launch."
            echo
            echo "### Commit Summary"
            echo "$commit_log"
          } > "$notes_file"

          {
            echo 'body<<EOF'
            cat "$notes_file"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: release_notes
    runs-on: macos-15
    steps:
      # The appcast is pushed to main at the end; a release from any other
      # ref would push that ref's commits to main (or fail after the GitHub
      # Release already exists).
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases must be dispatched from main (got ${GITHUB_REF})."
          exit 1

      # A release must be signed, notarized and carry an appcast entry; fail
      # rather than quietly ship an ad-hoc-signed, unsandboxed build.
      - name: Require release secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID SPARKLE_PRIVATE_KEY; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing release secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run tests
        run: swift test

      - name: Build release binary (arm64)
        run: swift build -c release --arch arm64

      - name: Generate icon
        run: swift scripts/generate-icon.swift icon.png

      - name: Generate AppIcon.icns
        run: |
          set -euo pipefail
          mkdir -p AppIcon.iconset
          sips -z 16   16   icon.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32   32   icon.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32   32   icon.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64   64   icon.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128  128  icon.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256  256  icon.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256  256  icon.png --out AppIcon.iconset/icon_256x256.png
          sips -z 512  512  icon.png --out AppIcon.iconset/icon_256x256@2x.png
          sips -z 512  512  icon.png --out AppIcon.iconset/icon_512x512.png
          sips -z 1024 1024 icon.png --out AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns AppIcon.iconset -o AppIcon.icns

      - name: Assemble .app bundle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          APP_NAME="SimpleSpread"
          BINARY_NAME="SimpleSpread"
          APP_DIR="${APP_NAME}.app"
          CONTENTS="${APP_DIR}/Contents"

          mkdir -p "${CONTENTS}/MacOS" "${CONTENTS}/Resources"
          cp ".build/release/${BINARY_NAME}" "${CONTENTS}/MacOS/${BINARY_NAME}"
          cp AppIcon.icns "${CONTENTS}/Resources/AppIcon.icns"

          ./scripts/write-info-plist.sh "$APP_DIR" "$VERSION"

      - name: Embed Sparkle
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          FEED="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/appcast.xml"
          ./scripts/embed-sparkle.sh "SimpleSpread.app" "$FEED"

      - name: Sign .app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP_DIR="SimpleSpread.app"

          if [[ -n "${APPLE_CERTIFICATE:-}" ]]; then
            echo "Signing with Developer ID certificate..."
            KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
            KP="$(openssl rand -hex 16)"
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KP" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KP" "$KEYCHAIN_PATH"
            security import "$RUNNER_TEMP/cert.p12" \
              -k "$KEYCHAIN_PATH" \
              -P "$APPLE_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"
            # Sign Sparkle's nested helpers inside-out first, then the app.
            ./scripts/sign-sparkle.sh "$APP_DIR" "$APPLE_SIGNING_IDENTITY"
            codesign --force --options runtime \
              --entitlements entitlements.plist \
              --sign "$APPLE_SIGNING_IDENTITY" \
              "$APP_DIR"
          else
            echo "::error::No APPLE_CERTIFICATE secret; refusing to ship an ad-hoc build."
            exit 1
          fi

      - name: Create .dmg
        env:
          VERSION: ${{ inputs.version }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP_NAME="SimpleSpread"
          DMG_NAME="SimpleSpread-v${VERSION}.dmg"
          STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$STAGING"
          cp -R "${APP_NAME}.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          # hdiutil intermittently fails with "Resource busy" on CI runners
          # (Spotlight/volume race), so retry a few times.
          for attempt in 1 2 3 4 5; do
            if hdiutil create \
                 -volname "${APP_NAME}" \
                 -srcfolder "$STAGING" \
                 -fs HFS+ \
                 -ov -format UDZO \
                 "$DMG_NAME"; then
              echo "DMG created on attempt ${attempt}."
              break
            fi
            if [[ ${attempt} -eq 5 ]]; then
              echo "hdiutil failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "hdiutil attempt ${attempt} failed (Resource busy?); retrying in 15s…"
            sleep 15
          done

          if [[ -n "${APPLE_CERTIFICATE:-}" && -n "${APPLE_ID:-}" ]]; then
            echo "Notarizing DMG..."
            xcrun notarytool submit "$DMG_NAME" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$DMG_NAME"
            echo "Notarization complete."
          else
            echo "::error::No notarization secrets; refusing to ship an unnotarized build."
            exit 1
          fi

          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release and upload DMG
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "Release v${VERSION} — release notes will be updated shortly." \
            "$DMG_NAME"

      # Sign the DMG with the Sparkle key and publish the appcast so existing
      # installs can auto-update.
      - name: Publish Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PRIVATE_KEY:-}" ]]; then
            echo "::error::No SPARKLE_PRIVATE_KEY secret (see docs/UPDATES.md)."
            exit 1
          fi
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${DMG_NAME}"
          ./scripts/update-appcast.sh "$DMG_NAME" "$VERSION" "$DOWNLOAD_URL" "appcast.xml"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "appcast: SimpleSpread ${VERSION}"
          # main may have moved while the build ran: rebase onto it and retry,
          # so the release never ends up without its appcast entry.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Appcast pushed on attempt ${attempt}."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the appcast to main; push it by hand (the GitHub Release exists)."
          exit 1

  finalize_release_notes:
    needs: [release_notes, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_BODY: ${{ needs.release_notes.outputs.body }}
          RELEASE_TAG: v${{ inputs.version }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const body = process.env.RELEASE_BODY;
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.data.id,
              body,
            });
