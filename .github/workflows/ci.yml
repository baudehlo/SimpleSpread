name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      # Warnings fail the build: CI's Swift is older and stricter than a
      # current Xcode, and new Sendable warnings are tomorrow's errors.
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      # Renders the real app window to a PNG via the app's self-capture hook.
      # Warn-only: runner GUI-session quirks must not mask build/test signal.
      # continue-on-error + a step timeout are the safety net: the app
      # self-terminates via the screenshot hook (~2s), and Sparkle stays inert
      # in this unbundled binary, so it can't wedge. The step timeout is a
      # GitHub-native hard cap (no reliance on a `timeout` binary, which macOS
      # runners don't ship).
      - name: Headless render smoke test
        continue-on-error: true
        timeout-minutes: 5
        run: |
          swift build -c release
          SIMPLESPREAD_SCREENSHOT="$RUNNER_TEMP/window.png" SIMPLESPREAD_DEMO=1 \
            .build/release/SimpleSpread || true
          if [ -s "$RUNNER_TEMP/window.png" ]; then
            echo "App rendered a $(stat -f%z "$RUNNER_TEMP/window.png") byte window capture"
          else
            echo "::warning::App did not produce a window capture on this runner"
          fi

      - name: Upload render capture
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: window-capture
          path: ${{ runner.temp }}/window.png

  # The iPad app: the shared tests, and the app driven in UI tests, on an
  # iPad simulator. Needs Xcode 26 (the iOS 26 SDK), hence macos-26.
  ipad:
    name: iPad Build & Test
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate the Xcode project
        working-directory: iOS
        run: |
          brew install xcodegen
          xcodegen

      - name: Pick an iPad simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ipads = [d for runtime, list in devices.items() if "iOS" in runtime for d in list if d["name"].startswith("iPad")]
          ipads.sort(key=lambda d: ("13-inch" not in d["name"], "Pro" not in d["name"]))
          print(ipads[0]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test
        working-directory: iOS
        run: |
          xcodebuild test -project SimpleSpread.xcodeproj -scheme SimpleSpread \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/ipad.xcresult"

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ipad-test-results
          path: ${{ runner.temp }}/ipad.xcresult

